<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Terminal">
  <defs>
    <linearGradient id="mono-shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161616"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <!-- Frame -->
  <rect width="64" height="64" rx="14" fill="#050505"/>
  <rect x="3" y="3" width="58" height="58" rx="12" fill="url(#mono-shell)" stroke="#2e2e2e" stroke-width="1.25"/>
  <!-- Title bar (neutral chrome, no color accents) -->
  <rect x="10" y="9" width="44" height="10" rx="3" fill="#111111" stroke="#252525" stroke-width="0.75"/>
  <circle cx="16.5" cy="14" r="2" fill="#3d3d3d"/>
  <circle cx="26" cy="14" r="2" fill="#3d3d3d"/>
  <circle cx="35.5" cy="14" r="2" fill="#3d3d3d"/>
  <!-- Screen -->
  <rect x="10" y="22" width="44" height="32" rx="4" fill="#080808" stroke="#2a2a2a" stroke-width="1"/>
  <!-- Scanlines (very subtle, mono) -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="0.5">
    <line x1="12" y1="28" x2="52" y2="28"/>
    <line x1="12" y1="34" x2="52" y2="34"/>
    <line x1="12" y1="40" x2="52" y2="40"/>
    <line x1="12" y1="46" x2="52" y2="46"/>
  </g>
  <!-- Prompt -->
  <path d="M17 40 L26 32 L17 24 V40Z" fill="#eaeaea"/>
  <!-- Block cursor -->
  <rect x="30" y="26" width="6" height="14" rx="1" fill="#eaeaea" opacity="0.85"/>
</svg>
